<!doctype html><html><head><title>Español Diario</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Español Diario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; task screens fill the height, tab screens sit above a bottom nav. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --soft:#E9EDF1; --line:#DDE3E9;
  --ink:#1B2430; --muted:#5B6573; --faint:#8A94A1;
  --teal:#1F6F7F; --teal-soft:#E3F0F2; --on-teal:#FFFFFF;
  --clay:#B4501A; --clay-soft:#FFF1E7; --on-clay:#FFFFFF;
  --night:#1B2430; --on-night:#FFFFFF; --night-muted:#C9D2DC;
  --shadow:0 1px 3px rgba(27,36,48,.08);
  --f-ui:"Plus Jakarta Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171D; --surface:#1A222B; --soft:#232D37; --line:#2C3743;
  --ink:#E7EDF2; --muted:#A3AFBB; --faint:#7C8896;
  --teal:#67B9C8; --teal-soft:#1C3439; --on-teal:#0E1A1E;
  --clay:#EE9A66; --clay-soft:#3A2619; --on-clay:#1E1209;
  --night:#0B1015; --on-night:#E7EDF2; --night-muted:#A3AFBB;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11171D; --surface:#1A222B; --soft:#232D37; --line:#2C3743;
  --ink:#E7EDF2; --muted:#A3AFBB; --faint:#7C8896;
  --teal:#67B9C8; --teal-soft:#1C3439; --on-teal:#0E1A1E;
  --clay:#EE9A66; --clay-soft:#3A2619; --on-clay:#1E1209;
  --night:#0B1015; --on-night:#E7EDF2; --night-muted:#A3AFBB;
  --shadow:none; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 24px;box-sizing:border-box}
#app.has-nav{padding-bottom:110px}
button,a.btn{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.eyebrow{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.btn{min-height:48px;border:none;border-radius:14px;padding:0 18px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-dark{background:var(--night);color:var(--on-night)}
.btn-teal{background:var(--teal);color:var(--on-teal)}
.btn-clay{background:var(--clay);color:var(--on-clay)}
.btn-ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.wide{width:100%}
.icon-btn{width:44px;height:44px;border:none;border-radius:12px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:4px}
.chip{font-size:13px;font-weight:700;border-radius:8px;padding:5px 10px}
.chip-teal{color:var(--teal);background:var(--teal-soft)} .chip-clay{color:var(--clay);background:var(--clay-soft)}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.top .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.title-xl{font-size:30px;font-weight:800;letter-spacing:-.5px}
.title-l{font-size:22px;font-weight:800}
.es{font-weight:700}
.play{width:52px;height:52px;border:none;border-radius:999px;background:var(--teal-soft);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.play.big{width:112px;height:112px;background:var(--teal);color:var(--on-teal)}
.play.sm{width:44px;height:44px;background:var(--surface);border:1.5px solid var(--line)}
.opt{min-height:58px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 14px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);font-size:16px;font-weight:600;width:100%}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.opt.right{border-color:var(--teal);background:var(--teal-soft)} .opt.right .k{background:var(--teal);color:var(--on-teal)}
.opt.wrong{border-color:var(--clay);background:var(--clay-soft)} .opt.wrong .k{background:var(--clay);color:var(--on-clay)}
.opt.dim{opacity:.6}
.feedback{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.ok{color:var(--teal)} .bad{color:var(--clay)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate button{min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;font-weight:700}
.rate small{font-size:12px;font-weight:600}
.r-again{background:var(--surface);border:2px solid var(--clay);color:var(--clay)}
.r-hard{background:var(--surface);border:2px solid var(--faint);color:var(--ink)}
.r-good{background:var(--teal);border:none;color:var(--on-teal)}
.r-again small,.r-hard small{color:var(--muted)}
.mic{width:76px;height:76px;border:none;border-radius:999px;background:var(--clay);color:var(--on-clay);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mic.rec{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,80,26,.45)}50%{box-shadow:0 0 0 14px rgba(180,80,26,0)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none;outline:4px solid var(--clay);outline-offset:4px}}
.ring{width:84px;height:84px;border-radius:999px;border:7px solid var(--teal);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.ring.low{border-color:var(--clay)}
.ring b{font-size:26px;line-height:1} .ring span{font-size:11px;color:var(--muted);font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:14px}
.w-ok{color:var(--teal)} .w-mid{color:var(--ink)} .w-low{color:var(--clay);text-decoration:underline wavy;text-underline-offset:5px}
.bubble{max-width:82%;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.b-them{background:var(--surface);border-bottom-left-radius:6px;box-shadow:var(--shadow);align-self:flex-start}
.b-me{background:var(--teal-soft);border-bottom-right-radius:6px;align-self:flex-end}
.avatar{width:34px;height:34px;border-radius:999px;background:var(--night);color:var(--on-night);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{background:none;border:none;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--teal);font-weight:700}
.list-row{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{min-height:34px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.seg button.on{background:var(--night);color:var(--on-night);font-weight:700}
.step{width:36px;height:36px;border:none;border-radius:10px;background:var(--soft);color:var(--ink);font-size:18px;font-weight:700}
.toggle{width:52px;height:32px;border:none;border-radius:999px;background:var(--line);padding:3px;display:flex}
.toggle span{width:26px;height:26px;border-radius:999px;background:#fff}
.toggle[aria-pressed="true"]{background:var(--teal);justify-content:flex-end}
.mast{display:flex;gap:3px}.mast i{width:12px;height:5px;border-radius:3px;background:var(--line)}.mast i.on{background:var(--teal)}
.search{height:46px;background:var(--surface);border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line)}
.search input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--ink);min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{height:36px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600}
.filters button.on{background:var(--night);border-color:var(--night);color:var(--on-night);font-weight:700}
.notice{background:var(--clay-soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55}
.loading{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.tabular{font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;border:none;background:none;color:var(--ink);font-size:15px;text-align:left;padding:0}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.spacer{flex:1}
</style>

<div id="app" aria-live="polite"><div class="loading" style="padding-top:40vh;justify-content:center">Loading…</div></div>
<nav class="tabs" id="tabs" hidden><div class="in"></div></nav>
<script type="module" src="./app.js"></script>
</body></html>
